<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quran Video</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.player{
    width:100%;
    max-width:1000px;
    background:#000;
}

.video{
    width:100%;
    aspect-ratio:16/9;
    border:0;
    display:block;
}

@media(max-width:600px){
    body{
        align-items:center;
    }

    .player{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="player">

<iframe
    class="video"
    src="https://drive.google.com/file/d/1N-ZimNgsHiCiQXlOpiuxwdv-71r5iq0f/preview"
    allow="autoplay; fullscreen"
    allowfullscreen>
</iframe>

</div>

</body>
</html>
