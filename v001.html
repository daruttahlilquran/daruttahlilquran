<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quran Video</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #000;
}

body {
    font-family: Arial, sans-serif;
}

.player {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    background: #000;
    position: relative;
}

.video-wrapper {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    position: relative;
}

video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #000;
}

/* Controls */
.controls {
    width: 100%;
    background: #111;
    padding: 8px 10px 10px;
}

/* Seek bar */
.seek-container {
    width: 100%;
    margin-bottom: 7px;
}

#seekBar {
    width: 100%;
    height: 4px;
    margin: 0;
    padding: 0;
    cursor: pointer;
    accent-color: #ffffff;
}

/* Bottom controls */
.bottom-controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

button {
    border: none;
    background: transparent;
    color: white;
    cursor: pointer;
    font-size: 18px;
    padding: 3px 5px;
}

button:active {
    opacity: 0.6;
}

.time {
    color: white;
    font-size: 13px;
    white-space: nowrap;
}

.spacer {
    flex: 1;
}

/* Volume */
.volume {
    width: 70px;
}

/* Mobile */
@media (max-width: 600px) {

    .controls {
        padding: 7px 8px 9px;
    }

    .bottom-controls {
        gap: 6px;
    }

    button {
        font-size: 17px;
    }

    .time {
        font-size: 12px;
    }

    .volume {
        width: 55px;
    }

    #seekBar {
        height: 4px;
    }
}
</style>
</head>

<body>

<div class="player">

    <div class="video-wrapper">

        <video
            id="video"
            playsinline
            preload="metadata"
        >
            <source
                src="https://drive.google.com/uc?export=download&id=1N-ZimNgsHiCiQXlOpiuxwdv-71r5iq0f"
                type="video/mp4"
            >
        </video>

    </div>

    <div class="controls">

        <!-- SEEK BAR -->
        <div class="seek-container">
            <input
                type="range"
                id="seekBar"
                min="0"
                max="100"
                value="0"
                step="0.1"
            >
        </div>

        <!-- BUTTONS -->
        <div class="bottom-controls">

            <button id="playBtn">▶</button>

            <span class="time">
                <span id="currentTime">00:00.0</span>
                /
                <span id="duration">00:00.0</span>
            </span>

            <div class="spacer"></div>

            <button id="muteBtn">🔊</button>

            <input
                type="range"
                id="volume"
                class="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

            <button id="fullscreenBtn">⛶</button>

        </div>

    </div>

</div>


<script>

const video = document.getElementById("video");
const playBtn = document.getElementById("playBtn");
const muteBtn = document.getElementById("muteBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");

const seekBar = document.getElementById("seekBar");
const volume = document.getElementById("volume");

const currentTimeDisplay =
    document.getElementById("currentTime");

const durationDisplay =
    document.getElementById("duration");


// ------------------------------------
// TIME FORMAT
// Shows 0.1 second precision
// ------------------------------------

function formatTime(seconds) {

    if (!isFinite(seconds)) {
        return "00:00.0";
    }

    let minutes = Math.floor(seconds / 60);

    let remainingSeconds =
        Math.floor(seconds % 60);

    let tenths =
        Math.floor((seconds % 1) * 10);

    minutes =
        String(minutes).padStart(2, "0");

    remainingSeconds =
        String(remainingSeconds).padStart(2, "0");

    return minutes + ":" +
           remainingSeconds + "." +
           tenths;
}


// ------------------------------------
// PLAY / PAUSE
// ------------------------------------

playBtn.addEventListener("click", function() {

    if (video.paused) {

        video.play();

    } else {

        video.pause();

    }

});


// Change button icon

video.addEventListener("play", function() {

    playBtn.textContent = "❚❚";

});

video.addEventListener("pause", function() {

    playBtn.textContent = "▶";

});


// ------------------------------------
// DURATION
// ------------------------------------

video.addEventListener("loadedmetadata", function() {

    durationDisplay.textContent =
        formatTime(video.duration);

});


// ------------------------------------
// CURRENT TIME
// ------------------------------------

video.addEventListener("timeupdate", function() {

    currentTimeDisplay.textContent =
        formatTime(video.currentTime);

    if (video.duration) {

        seekBar.value =
            (video.currentTime / video.duration) * 100;

    }

});


// ------------------------------------
// SEEK
// ------------------------------------

seekBar.addEventListener("input", function() {

    if (!video.duration) return;

    video.currentTime =
        (seekBar.value / 100) * video.duration;

});


// ------------------------------------
// VOLUME
// ------------------------------------

volume.addEventListener("input", function() {

    video.volume = volume.value;

    if (video.volume === 0) {

        muteBtn.textContent = "🔇";

    } else {

        muteBtn.textContent = "🔊";

    }

});


// ------------------------------------
// MUTE
// ------------------------------------

muteBtn.addEventListener("click", function() {

    video.muted = !video.muted;

    if (video.muted) {

        muteBtn.textContent = "🔇";

    } else {

        muteBtn.textContent = "🔊";

    }

});


// ------------------------------------
// FULLSCREEN
// ------------------------------------

fullscreenBtn.addEventListener("click", function() {

    const player =
        document.querySelector(".player");

    if (document.fullscreenElement) {

        document.exitFullscreen();

    } else {

        if (player.requestFullscreen) {

            player.requestFullscreen();

        } else if (player.webkitRequestFullscreen) {

            player.webkitRequestFullscreen();

        }

    }

});


// ------------------------------------
// VIDEO ERROR
// ------------------------------------

video.addEventListener("error", function() {

    console.log("Video could not be loaded.");

});

</script>

</body>
</html>
