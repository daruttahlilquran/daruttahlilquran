<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               viewport-fit=cover">

<meta name="theme-color" content="#000000">

<title>Video 001</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

/* Main page */
.page {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    background: #000;
}

/* Video area */
.video-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
}

/* Google Drive player */
.video-wrapper iframe {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;
    margin: 0;
    padding: 0;

    display: block;

    background: #000;
}

/* Loading layer */
.loading {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;

    z-index: 2;
    pointer-events: none;

    transition: opacity 0.4s ease;
}

.loading.hide {
    opacity: 0;
}

.loader {
    width: 34px;
    height: 34px;

    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff;

    border-radius: 50%;

    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* Bottom information */
.info {
    padding: 18px 20px 28px;
    background: #000;
}

.title {
    margin: 0;

    font-size: 21px;
    line-height: 1.4;

    font-weight: 600;
}

.subtitle {
    margin-top: 7px;

    font-size: 14px;
    line-height: 1.5;

    color: #aaa;
}

/* Mobile */
@media (max-width: 600px) {

    .video-wrapper {
        border-radius: 0;
    }

    .info {
        padding: 15px 16px 24px;
    }

    .title {
        font-size: 18px;
    }

    .subtitle {
        font-size: 13px;
    }
}

/* Desktop */
@media (min-width: 601px) {

    body {
        background: #111;
    }

    .page {
        margin-top: 30px;
        margin-bottom: 30px;
        border-radius: 10px;
        overflow: hidden;
    }

}

</style>

</head>

<body>

<main class="page">

    <!-- VIDEO -->
    <div class="video-wrapper">

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="loader"></div>
        </div>

        <!-- GOOGLE DRIVE VIDEO -->
        <iframe
            id="player"
            src="https://drive.google.com/file/d/1N-ZimNgsHiCiQXlOpiuxwdv-71r5iq0f/preview"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>


    <!-- VIDEO INFORMATION -->
    <section class="info">

        <h1 class="title">
            Video 001
        </h1>

        <div class="subtitle">
            Daruttahlil Quran
        </div>

    </section>

</main>


<script>

/* Hide loading screen after player loads */

const player = document.getElementById("player");
const loading = document.getElementById("loading");

player.addEventListener("load", function () {

    setTimeout(function () {
        loading.classList.add("hide");
    }, 500);

});

</script>

</body>
</html>
