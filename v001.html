<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Quran Video</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

/* PLAYER */
.player {
    width: 100vw;
    height: 56.25vw;
    max-width: 1100px;
    position: relative;
    background: #000;
    overflow: hidden;
}

/* GOOGLE DRIVE PLAYER */
.player iframe {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    border: 0;
    margin: 0;
    padding: 0;

    display: block;
}

/* HIDE GOOGLE DRIVE SEEK BAR */
.hide-controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;

    height: 58px;

    background: #000;

    z-index: 10;

    pointer-events: none;
}

</style>

</head>

<body>

<div class="player">

    <iframe
        src="https://drive.google.com/file/d/1N-ZimNgsHiCiQXlOpiuxwdv-71r5iq0f/preview"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>

    <!-- Hide bottom seek bar -->
    <div class="hide-controls"></div>

</div>

</body>
</html>
