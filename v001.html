<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 1;
    padding: 1;
    width: 100%;
    min-height: 100%;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.player {
    width: 100%;
    max-width: 1200px;
    aspect-ratio: 16 / 9;
    position: center;
    overflow: hidden;
    background: #000;
}

.player iframe {
    position: absolute;
    inset: 0;
    width: 120%;
    height: 100%;
    border: 0;
    display: block;
}

@media (max-width: 600px) {

    .player {
        width: 100vw;
        height: 56.25vw;
        max-width: none;
    }

}
</style>

</head>

<body>

<div class="player">

    <iframe
        src="https://drive.google.com/file/d/1N-ZimNgsHiCiQXlOpiuxwdv-71r5iq0f/preview"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>

</div>

</body>
</html>
