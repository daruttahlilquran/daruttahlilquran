<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Quran Video</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.player {
    width: 100vw;
    max-width: 1100px;
    aspect-ratio: 16 / 9;
    background: #000;
    position: relative;
}

video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #000;
}

</style>

</head>

<body>

<div class="player">

<video
    id="video"
    controls
    playsinline
    preload="metadata">

    <!-- এখানে direct MP4 URL বসবে -->
    <source
        src="YOUR_DIRECT_MP4_URL_HERE"
        type="video/mp4">

</video>

</div>

</body>
</html>
