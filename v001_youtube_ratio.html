<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video 001</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
  }
  body {
    font-family: Arial, sans-serif;
    color: #fff;
  }
  .page {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
  }
  .video {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
  }
  iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .title {
    padding: 14px 16px 20px;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    background: #000;
  }
</style>
</head>
<body>
  <main class="page">
    <div class="video">
      <iframe
        src="https://drive.google.com/file/d/1N-ZimNgsHiCiQXlOpiuxwdv-71r5iq0f/preview"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>
    </div>
    <div class="title">Video 001</div>
  </main>
</body>
</html>
