<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Quran Video</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

/* PLAYER */
.player {
    position: relative;
    width: 100vw;
    max-width: 1100px;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
}

/* VIDEO */
video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #000;
}

/* CENTER PLAY BUTTON */
.play-button {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 70px;
    height: 70px;

    border-radius: 50%;
    border: none;

    background: rgba(255,255,255,0.92);

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 5;
}

/* PLAY ICON */
.play-button::after {
    content: "";

    margin-left: 5px;

    width: 0;
    height: 0;

    border-top: 12px solid transparent;
    border-bottom: 12px solid transparent;
    border-left: 18px solid #111;
}

/* HIDE PLAY BUTTON WHILE PLAYING */
.player.playing .play-button {
    display: none;
}

/* SMALL SCREEN */
@media (max-width: 600px) {

    .player {
        width: 100vw;
        aspect-ratio: 16 / 9;
    }

    .play-button {
        width: 62px;
        height: 62px;
    }

}

</style>

</head>

<body>

<div class="player" id="player">

    <video
        id="video"
        playsinline
        preload="metadata">

        <source
            src="https://drive.usercontent.google.com/download?id=1N-ZimNgsHiCiQXlOpiuxwdv-71r5iq0f&export=download"
            type="video/mp4">

    </video>

    <button
        class="play-button"
        id="playButton"
        aria-label="Play">
    </button>

</div>

<script>

const video = document.getElementById("video");
const player = document.getElementById("player");
const playButton = document.getElementById("playButton");

function playVideo() {

    video.play()
        .then(() => {
            player.classList.add("playing");
        })
        .catch((error) => {
            console.log("Video could not play:", error);
        });

}

playButton.addEventListener("click", playVideo);

video.addEventListener("click", function () {

    if (video.paused) {
        playVideo();
    } else {
        video.pause();
        player.classList.remove("playing");
    }

});

video.addEventListener("pause", function () {
    player.classList.remove("playing");
});

video.addEventListener("play", function () {
    player.classList.add("playing");
});

</script>

</body>

</html>
