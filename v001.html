<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video 001</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #111;
    font-family: Arial, sans-serif;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    width: 100%;
    max-width: 900px;
    padding: 16px;
  }
  .video {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
  h1 {
    font-size: 20px;
    margin: 14px 0 0;
    text-align: center;
  }
</style>
</head>
<body>
  <main class="container">
    <div class="video">
      <iframe
        src="https://drive.google.com/file/d/1N-ZimNgsHiCiQXlOpiuxwdv-71r5iq0f/preview"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>
    </div>
    <h1>Video 001</h1>
  </main>
</body>
</html>
