<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Quran Video</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.video-box {
    width: 100vw;
    height: 56.25vw;
    max-width: 1100px;
    background: #000;
    position: relative;
    overflow: hidden;
}

.video-box iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

</style>

</head>

<body>

<div class="video-box">

<iframe
    src="https://drive.google.com/file/d/1N-ZimNgsHiCiQXlOpiuxwdv-71r5iq0f/preview?rm=minimal"
    allow="autoplay; fullscreen"
    allowfullscreen>
</iframe>

</div>

</body>
</html>
