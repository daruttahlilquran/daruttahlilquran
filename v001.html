<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran Video</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: black;
    }

    .video {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 100vw;
        max-width: 1100px;
        aspect-ratio: 16 / 9;
        transform: translate(-50%, -50%);
        background: black;
    }

    .video iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
    }
</style>
</head>

<body>

<div class="video">
    <iframe
        src="https://drive.google.com/file/d/1N-ZimNgsHiCiQXlOpiuxwdv-71r5iq0f/preview"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
</div>

</body>
</html>
